services:
  # Traefik reverse proxy for routing and SSL/TLS termination
  traefik:
    image: traefik:v3.0
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  resume-matcher:
    build:
      context: .
      dockerfile: Dockerfile
    image: resume-matcher
    container_name: resume-matcher
    # No direct port exposure - access via Traefik
    volumes:
      - resume-data:/app/backend/data
      - backend-socket:/run  # Unix socket for backend-frontend communication
    environment:
      - NODE_ENV=production
      # LLM Configuration - configure via Settings UI or set env vars for explicit overrides
      # Supported providers: openai, anthropic, openrouter, gemini, deepseek, ollama
      # Defaults are defined in apps/backend/app/config.py
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      # For Ollama running on host machine, use host.docker.internal:
      # - LLM_API_BASE=http://host.docker.internal:11434
      - LLM_API_BASE=${LLM_API_BASE:-}
    restart: unless-stopped
    labels:
      # Enable Traefik for this service
      - "traefik.enable=true"
      # HTTP router
      - "traefik.http.routers.resume-matcher.rule=Host(`${DOMAIN:-localhost}`)"
      - "traefik.http.routers.resume-matcher.entrypoints=web"
      - "traefik.http.routers.resume-matcher.service=resume-matcher"
      # Service configuration
      - "traefik.http.services.resume-matcher.loadbalancer.server.port=3000"
    healthcheck:
      # Health check uses Unix socket
      test: ["CMD", "curl", "-f", "--unix-socket", "/run/backend.sock", "http://localhost/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  resume-data:
    driver: local
  backend-socket:
    driver: local
